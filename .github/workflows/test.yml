name: Tests

on:
  pull_request:
    branches:
      - master

# A new push to a PR makes the in-flight run obsolete; cancel it instead of
# letting 20+ docker jobs run to completion against a stale commit (and hog
# runner slots the new run then queues behind).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the uv environment
        uses: ./.github/actions/uv-env
      - name: Check format
        run: uv run --no-build --no-sync ruff format --diff
      - name: Linting
        run: uv run --no-build --no-sync ruff check
      - name: Type check
        run: uv run --no-build --no-sync ty check -- nextcloud_mcp_server
      # Fails if a module is imported at runtime but not declared in
      # [project.dependencies] (#1285). Config in pyproject.toml [tool.deptry].
      - name: Check for undeclared dependencies
        run: uv run --no-build --no-sync deptry .

  unit-test:
    runs-on: ubuntu-latest
    needs: [linting]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the uv environment
        uses: ./.github/actions/uv-env
      # -n auto fans the (fully mocked) unit tests across the runner's cores.
      # -q instead of -v: with xdist, per-test progress lines are interleaved
      # noise, and failures still print in full.
      - name: Run unit tests
        run: uv run --no-build --no-sync pytest -q -m unit -n auto -o "addopts=-p no:asyncio"

  # Cross-platform install smoke test. Installs the package (and its full
  # dependency closure) into an isolated environment and runs the CLI
  # entrypoint, which exercises the cli -> server -> webdav import chain. This is
  # the regression guard for #877, where a Unix-only ``import resource`` in that
  # chain crashed Windows startup. Runs on Windows in addition to Linux so any
  # platform-specific import regression fails here.
  package-smoke:
    needs: [linting]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: package-smoke (${{ matrix.os }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately NOT ./.github/actions/uv-env: that syncs the dev group,
      # which carries pyroscope-io -- a Rust extension with no Windows wheel,
      # kept out of the default dependencies for exactly that reason (see
      # pyproject.toml). This job needs the built wheel and nothing else, and
      # syncing the dev group here fails the Windows runner outright with
      # "pyroscope-io==1.1.0 ... marked as --no-build but has no binary
      # distribution".
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Build the wheel
        shell: bash
        run: uv build --wheel --out-dir dist
      # Installs the built wheel (not the source tree) into a throwaway
      # environment: --no-build cannot install this project from source, and
      # the wheel is the artifact users actually get. Its runtime dependencies
      # all publish wheels, which is what keeps --no-build viable here. bash on
      # both runners so the glob expands on Windows too.
      - name: Smoke test CLI (isolated install)
        shell: bash
        run: uv run --isolated --no-project --no-build --with dist/*.whl nextcloud-mcp-server --help

  integration-test:
    runs-on: ubuntu-latest
    needs: [linting]
    strategy:
      fail-fast: false
      matrix:
        nextcloud_version:
          - "32"
          - "33"
          - "34"
        mode:
          - "single-user"
          - "multi-user-basic"
          - "login-flow"
          - "keycloak"
          - "ldap"
          - "login-flow-ldap"
        include:
          # Version-specific image pins — Renovate updates these via customManagers in renovate.json
          # Each entry is pinned to its major version (e.g., NC 32 only gets 32.x updates)
          - nextcloud_version: "32"
            nextcloud_image: "docker.io/library/nextcloud:32.0.14@sha256:29d45e778fe42c07cd3b06ddbf5fe4bf383f3f663c69dee8f0def1e7441f48b8"
          - nextcloud_version: "33"
            nextcloud_image: "docker.io/library/nextcloud:33.0.8@sha256:9ed3924f92f651aab622b23557b3f3dbcf04f7678567f50a41dbace2463c0a52"
          # NOTE: the nc34 lanes are EXPECTED TO FAIL until Astrolabe publishes an
          # NC-34-compatible release to the app store. cbcoutinho/astrolabe#242
          # (max-version="34") is merged but not yet released, so
          # `occ app:install astrolabe` still aborts the app container with
          # "App "Astrolabe" cannot be installed because it is not compatible with
          # this version of the server". Check availability with:
          #   curl -sL https://apps.nextcloud.com/api/v1/platform/34.0.0/apps.json \
          #     | jq '[.[] | select(.id=="astrolabe")] | length'
          # A non-zero result means the release is live and these lanes should go
          # green on a re-run.
          - nextcloud_version: "34"
            nextcloud_image: "docker.io/library/nextcloud:34.0.3@sha256:b97df9e0e1ee3c8c6cc009cb3f12ddce915d624d543b3bb93882025fe323a407"

          # Mode-specific properties
          - mode: single-user
            profile: single-user
            markers: "(smoke and not keycloak and not login_flow and not multi_user_basic and not ldap and not login_flow_ldap) or (integration and not keycloak and not login_flow and not multi_user_basic and not ldap and not login_flow_ldap)"
            wait-port: 8000
            mcp-internal-url: "http://mcp:8000"
            needs-playwright: false
            # Also start GreenMail (SMTP/IMAP) so the Mail integration tests have
            # a real backend; the Mail account is provisioned in a step below.
            extra-compose-profiles: "--profile mail"
            # This is the long pole of the whole workflow (~15min of pytest),
            # and the only lane that can be fanned out: the other modes go
            # through the OAuth fixtures, whose callback server binds a fixed
            # localhost:8081 (tests/conftest.py), so parallel workers collide.
            # --dist loadfile keeps each file on one worker, so intra-file
            # ordering and module-scoped fixtures still hold; the shared
            # Nextcloud is safe because the resource fixtures name everything
            # with a uuid suffix.
            extra-args: >-
              --ignore=tests/integration/test_qdrant_collection_creation.py
              -n 4 --dist loadfile

          - mode: multi-user-basic
            profile: multi-user-basic
            markers: "multi_user_basic"
            wait-port: 8003
            mcp-internal-url: "http://mcp-multi-user-basic:8000"
            needs-playwright: true
            extra-args: ""

          - mode: login-flow
            profile: login-flow
            markers: "login_flow"
            wait-port: 8004
            mcp-internal-url: "http://mcp-login-flow:8004"
            needs-playwright: true
            extra-args: ""

          - mode: keycloak
            profile: keycloak
            markers: "keycloak"
            wait-port: 8002
            mcp-internal-url: "http://mcp-keycloak:8002"
            needs-playwright: true
            extra-args: ""

          # LDAP-backend lane (GH #980 reproduction). Reuses the multi-user
          # BasicAuth MCP service (port 8003) and adds the `ldap` profile
          # (OpenLDAP). user_ldap is configured automatically by the app-hook
          # post-installation/15-setup-ldap-backend.sh. No browser needed.
          - mode: ldap
            profile: multi-user-basic
            extra-compose-profiles: "--profile ldap"
            markers: "ldap"
            wait-port: 8003
            mcp-internal-url: "http://mcp-multi-user-basic:8000"
            needs-playwright: false
            extra-args: ""

          # Login-flow mode against the LDAP backend: proves the #980 principal
          # resolution holds in login-flow mode too (identity via OIDC, API
          # access via a per-user app password). login-flow MCP (8004) +
          # openldap; user_ldap is auto-configured by the post-installation
          # hook. Dedicated `login_flow_ldap` marker keeps it out of the plain
          # `login_flow` and `ldap` lanes. Needs a browser for Login Flow v2.
          - mode: login-flow-ldap
            profile: login-flow
            extra-compose-profiles: "--profile ldap"
            markers: "login_flow_ldap"
            wait-port: 8004
            mcp-internal-url: "http://mcp-login-flow:8004"
            needs-playwright: true
            extra-args: ""

    name: integration (${{ matrix.mode }} / nc${{ matrix.nextcloud_version }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Set up PHP 8.4
        if: matrix.mode != 'single-user'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          coverage: none

      - name: Set up Node.js
        if: matrix.mode != 'single-user'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Astrolabe is the only app built from its submodule here; oidc is
      # installed from the app store by app-hooks/post-installation, so it
      # needs no build step and no mount in docker-compose.yml.
      - name: Build Astrolabe app
        if: matrix.mode != 'single-user'
        run: |
          cd third_party/astrolabe
          composer install --no-dev --optimize-autoloader
          npm ci --ignore-scripts
          npm run build

      # Generate an ephemeral Fernet key per CI run. docker-compose.yml
      # requires TOKEN_ENCRYPTION_KEY (PR #758 finding 5 removed the
      # hardcoded default), but the CI tokens.db is destroyed at the end of
      # the job so there is no value in persisting the key as a repo secret.
      # ``openssl rand -base64 32`` produces 32 bytes encoded as 44 base64
      # chars; ``tr '+/' '-_'`` converts to URL-safe base64, which is
      # exactly what Fernet expects.
      - name: Generate ephemeral TOKEN_ENCRYPTION_KEY
        run: |
          KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          echo "TOKEN_ENCRYPTION_KEY=${KEY}" >> "$GITHUB_ENV"

      # Start services with the appropriate profile
      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@ee6af68587292d72db67743171809c19787df4c9 # v3.1.0
        with:
          compose-file: "./docker-compose.yml"
          compose-flags: "--profile ${{ matrix.profile }} ${{ matrix.extra-compose-profiles }}"
          up-flags: "--build"
        env:
          MCP_SERVER_URL: ${{ matrix.mcp-internal-url }}
          NEXTCLOUD_IMAGE: ${{ matrix.nextcloud_image }}
          # Inherited from $GITHUB_ENV via the previous step.
          TOKEN_ENCRYPTION_KEY: ${{ env.TOKEN_ENCRYPTION_KEY }}

      - name: Set up the uv environment
        uses: ./.github/actions/uv-env

      - name: Install Playwright
        if: matrix.needs-playwright
        run: uv run --no-build --no-sync playwright install chromium --with-deps

      # Wait for Nextcloud to be healthy
      - name: Wait for Nextcloud
        run: |
          echo "Waiting for Nextcloud at http://localhost:8080..."
          max_attempts=60
          attempt=0
          until curl -sSf http://localhost:8080/status.php 2>/dev/null | grep -q '"installed":true'; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "Nextcloud did not become ready in time."
              docker compose logs app
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts: Not ready, sleeping 5s..."
            sleep 5
          done
          echo "Nextcloud is ready."

      # Provision a GreenMail-backed Mail account for the Mail integration tests
      # (single-user lane only; the `mail` profile started GreenMail above).
      - name: Provision GreenMail mail account
        if: matrix.mode == 'single-user'
        run: bash scripts/provision-greenmail-account.sh admin admin@example.org

      # Wait for the MCP service to be healthy
      - name: Wait for MCP service (${{ matrix.mode }})
        run: |
          echo "Waiting for MCP service on port ${{ matrix.wait-port }}..."
          max_attempts=30
          attempt=0
          until curl -o /dev/null -s -w "%{http_code}\n" http://localhost:${{ matrix.wait-port }}/health 2>/dev/null | grep -qE "200|404|405"; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "MCP service did not become ready in time."
              docker compose --profile ${{ matrix.profile }} logs
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts: Not ready, sleeping 5s..."
            sleep 5
          done
          echo "MCP service is ready on port ${{ matrix.wait-port }}."

      # user_ldap is configured automatically by the app-hook
      # app-hooks/post-installation/15-setup-ldap-backend.sh (gated on the
      # openldap service). This step just surfaces the resulting config for
      # debugging, mirroring the keycloak verify step below.
      - name: Verify LDAP backend
        if: matrix.mode == 'ldap' || matrix.mode == 'login-flow-ldap'
        run: |
          echo "=== user_ldap enabled? ==="
          docker compose exec -T app php occ app:list 2>/dev/null | grep -i ldap || echo "user_ldap NOT enabled"
          echo "=== user_ldap connection ==="
          # Re-derive the config id the same way the app-hook does, rather than
          # assuming s01, so the diagnostic stays accurate if discovery differs.
          config_id=$(docker compose exec -T app php occ ldap:show-config 2>/dev/null | grep -E '^\| Configuration' | grep -oE 's[0-9]+' | head -n1)
          docker compose exec -T app php occ ldap:test-config "${config_id:-s01}" 2>&1 || echo "ldap:test-config failed"

      - name: Wait for Keycloak
        if: matrix.mode == 'keycloak'
        run: |
          echo "Waiting for Keycloak realm at http://localhost:8888..."
          max_attempts=30
          attempt=0
          until curl -sf http://localhost:8888/realms/nextcloud-mcp > /dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "Keycloak did not become ready in time."
              docker compose --profile keycloak logs keycloak
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts: Not ready, sleeping 5s..."
            sleep 5
          done
          echo "Keycloak is ready."

      - name: Verify OIDC configuration
        if: matrix.mode == 'login-flow' || matrix.mode == 'keycloak' || matrix.mode == 'login-flow-ldap'
        run: |
          echo "=== OIDC Discovery ==="
          curl -s http://localhost:8080/.well-known/openid-configuration | jq .
          echo "=== OIDC App Status ==="
          docker compose exec -T app php occ app:list --output=json 2>/dev/null | jq '.enabled.oidc // "NOT INSTALLED"'

      - name: Verify Keycloak realm
        if: matrix.mode == 'keycloak'
        run: |
          echo "=== Keycloak Realm Discovery ==="
          curl -s http://localhost:8888/realms/nextcloud-mcp/.well-known/openid-configuration | jq .
          echo "=== Keycloak Provider in Nextcloud ==="
          docker compose exec -T app php occ user_oidc:provider keycloak 2>/dev/null || echo "Provider not yet configured"

      - name: Run tests (${{ matrix.mode }})
        env:
          NEXTCLOUD_HOST: "http://localhost:8080"
          NEXTCLOUD_USERNAME: "admin"
          NEXTCLOUD_PASSWORD: "admin"
        run: |
          uv run --no-build --no-sync pytest -v \
            --log-cli-level=WARN \
            -m '${{ matrix.markers }}' \
            -o "addopts=-p no:asyncio" \
            --timeout=300 \
            ${{ matrix.extra-args }}

      - name: Collect service logs on failure
        if: failure()
        run: |
          docker compose --profile ${{ matrix.profile }} ${{ matrix.extra-compose-profiles }} logs --tail=500 > /tmp/docker-compose-logs.txt 2>&1
          docker compose exec -T app cat /var/www/html/data/nextcloud.log 2>/dev/null | tail -100 > /tmp/nextcloud-app.log 2>&1 || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-${{ matrix.mode }}-nc${{ matrix.nextcloud_version }}
          path: |
            /tmp/*.png
            /tmp/docker-compose-logs.txt
            /tmp/nextcloud-app.log
          retention-days: 7
          if-no-files-found: ignore

  # Docling OCR backend lane (ADR-031). Starts the single-user MCP service plus
  # the docker-compose `docling` profile (docling-serve-cpu container) and runs
  # the gated `-m docling` suite: an image auto-routes to docling and its text is
  # OCR'd back out, a text-layer PDF is force-parsed, and an unknown forced
  # processor errors cleanly. Kept as its own job (not a matrix mode) because the
  # docling-serve-cpu image is large, CPU OCR is slow, and it needs no Nextcloud
  # version matrix — a single NC image (the compose default) is enough.
  docling-integration:
    name: integration (docling)
    runs-on: ubuntu-latest
    needs: [linting]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker-compose.yml requires TOKEN_ENCRYPTION_KEY; generate an ephemeral
      # one (the CI tokens.db is destroyed with the job). See the integration job.
      - name: Generate ephemeral TOKEN_ENCRYPTION_KEY
        run: |
          KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          echo "TOKEN_ENCRYPTION_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Run docker compose (single-user + docling)
        uses: hoverkraft-tech/compose-action@ee6af68587292d72db67743171809c19787df4c9 # v3.1.0
        with:
          compose-file: "./docker-compose.yml"
          compose-flags: "--profile single-user --profile docling"
          up-flags: "--build"
        env:
          TOKEN_ENCRYPTION_KEY: ${{ env.TOKEN_ENCRYPTION_KEY }}
          # Enable the docling backend in the single-user mcp service and point it
          # at the docling-serve container on the compose network.
          ENABLE_DOCLING: "true"
          DOCLING_API_URL: "http://docling:5001"
          # CPU OCR is slow; give the sync convert call generous headroom.
          DOCLING_TIMEOUT: "300"
          # Docling serves PDFs as the OCR provider, so the OCR tier has to be on
          # for a scanned PDF to reach it (there is no per-call processor override
          # any more -- Deck #894).
          DOCUMENT_OCR_ENABLED: "true"
          DOCUMENT_OCR_PROVIDER: "docling"
          DOCUMENT_OCR_TIMEOUT_SECONDS: "300"

      - name: Set up the uv environment
        uses: ./.github/actions/uv-env

      - name: Wait for Nextcloud
        run: |
          echo "Waiting for Nextcloud at http://localhost:8080..."
          max_attempts=60
          attempt=0
          until curl -sSf http://localhost:8080/status.php 2>/dev/null | grep -q '"installed":true'; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "Nextcloud did not become ready in time."
              docker compose logs app
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts: Not ready, sleeping 5s..."
            sleep 5
          done
          echo "Nextcloud is ready."

      - name: Wait for docling-serve
        run: |
          echo "Waiting for docling-serve /health on http://localhost:5001..."
          max_attempts=60
          attempt=0
          until curl -sf http://localhost:5001/health > /dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "docling-serve did not become ready in time."
              docker compose --profile docling logs docling
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts: Not ready, sleeping 5s..."
            sleep 5
          done
          echo "docling-serve is ready."

      - name: Wait for MCP service (single-user)
        run: |
          echo "Waiting for MCP service on port 8000..."
          max_attempts=30
          attempt=0
          until curl -o /dev/null -s -w "%{http_code}\n" http://localhost:8000/health 2>/dev/null | grep -qE "200|404|405"; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "MCP service did not become ready in time."
              docker compose --profile single-user logs mcp
              exit 1
            fi
            echo "Attempt $attempt/$max_attempts: Not ready, sleeping 5s..."
            sleep 5
          done
          echo "MCP service is ready on port 8000."

      - name: Run docling tests
        env:
          NEXTCLOUD_HOST: "http://localhost:8080"
          NEXTCLOUD_USERNAME: "admin"
          NEXTCLOUD_PASSWORD: "admin"
          # Selects the skipif-gated assertions in tests/integration/test_docling_api.py.
          # These must mirror what the compose step gave the MCP service: the
          # skipifs read this process's environment, not the container's, so a
          # value set only on compose leaves the test silently skipped.
          ENABLE_DOCLING: "true"
          DOCUMENT_OCR_ENABLED: "true"
          DOCUMENT_OCR_PROVIDER: "docling"
        run: |
          uv run --no-build --no-sync pytest -v \
            --log-cli-level=WARN \
            -m docling \
            -o "addopts=-p no:asyncio" \
            --timeout=600

      - name: Collect service logs on failure
        if: failure()
        run: |
          docker compose --profile single-user --profile docling logs --tail=500 > /tmp/docker-compose-logs.txt 2>&1
          docker compose exec -T app cat /var/www/html/data/nextcloud.log 2>/dev/null | tail -100 > /tmp/nextcloud-app.log 2>&1 || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-docling
          path: |
            /tmp/docker-compose-logs.txt
            /tmp/nextcloud-app.log
          retention-days: 7
          if-no-files-found: ignore
