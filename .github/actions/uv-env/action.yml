name: uv environment
description: >
  Install uv and the locked dependencies without ever executing a third-party
  build script, then install this project from a wheel built from its own
  source. Every job that runs `uv run` uses this.

runs:
  using: composite
  steps:
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true

    - name: Install locked dependencies without running build scripts
      shell: bash
      run: |
        # --no-build refuses to build any source distribution, so a compromised
        # dependency cannot execute code at install time (githubactions:S8541).
        #
        # It applies to *this* project too, which has no wheel on any index, so
        # a plain `uv sync --no-build` fails with "Distribution
        # nextcloud-mcp-server @ editable+. can't be installed because it is
        # marked as --no-build but has no binary distribution". Hence the split:
        # dependencies come from wheels only, and the one build we do run is of
        # our own source, whose build backend is not a supply-chain risk.
        uv sync --frozen --no-build --no-install-project
        uv build --wheel --out-dir dist
        uv pip install --no-deps --no-build dist/*.whl
