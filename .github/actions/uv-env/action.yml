name: uv environment
description: >
  Install uv and the locked dependencies without ever executing a third-party
  build script, then install this project from a wheel built from its own
  source. Every job that runs `uv run` uses this.

runs:
  using: composite
  steps:
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install locked dependencies without running build scripts
      shell: bash
      run: |
        # --no-build refuses to build any source distribution, so a compromised
        # dependency cannot execute code at install time (githubactions:S8541).
        #
        # Our own workspace packages (the server and nextcloud-client) have no
        # wheel on any index, but --no-build only refuses them as *editable*
        # installs ("editable+. can't be installed because it is marked as
        # --no-build"). --no-editable has uv build them with uv_build, which
        # ships inside the uv binary, so no third-party code runs -- and the
        # install stays on the lockfile (githubactions:S8544).
        #
        # NOTE: `uv sync` installs the dev group, which carries pyroscope-io --
        # no Windows wheel. Any job on a Windows runner must skip this action
        # and build the wheel directly (see package-smoke).
        uv sync --frozen --no-build --no-editable
